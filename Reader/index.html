<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadEra Pro - EPUB Reader</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
</head>
<body class="theme-light">

  <header id="app-header">
    <div class="nav-tabs">
      <button id="tab-library" class="tab-btn active">📚 Bookshelf</button>
      <button id="tab-reader" class="tab-btn" style="display:none;">📖 Reader</button>
    </div>
    <div class="header-actions">
      <a href="https://oceanpdf.com" target="_blank" class="action-btn ocean-btn" title="Download books from OceanPDF">📥 OceanPDF</a>
      <label for="file-input" class="action-btn upload-btn">+ Add Books</label>
      <input type="file" id="file-input" accept=".epub" multiple style="display: none;" />
    </div>
  </header>

  <main id="library-view" class="view-container">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterShelf('all', this)">All Books</button>
      <button class="filter-btn" onclick="filterShelf('unread', this)">Unread</button>
      <button class="filter-btn" onclick="filterShelf('reading', this)">Reading</button>
      <button class="filter-btn" onclick="filterShelf('finished', this)">Finished</button>
    </div>
    <div id="shelf-grid" class="shelf-grid"></div>
  </main>

  <div id="reader-view" class="view-container" style="display: none;">
    <div id="reader-controls" class="reader-header">
      <button id="toc-btn" class="control-btn" title="Table of Contents">📑 TOC</button>
      <button id="audiobook-btn" class="control-btn" title="Listen to Audiobook">🎧 Listen</button>
      <span id="live-clock" class="reader-clock">00:00</span>
      <div class="font-controls">
        <button id="font-dec" class="control-btn">A-</button>
        <button id="font-inc" class="control-btn">A+</button>
      </div>
      <div class="theme-picker">
        <button id="theme-light" class="theme-dot light" title="Light"></button>
        <button id="theme-sepia" class="theme-dot sepia" title="Sepia"></button>
        <button id="theme-purple" class="theme-dot purple" title="Wife's Purple Theme"></button>
        <button id="theme-navy" class="theme-dot navy" title="Navy"></button>
        <button id="theme-dark" class="theme-dot dark" title="Dark"></button>
      </div>
    </div>

    <div id="viewer-container" style="position: relative; width: 100%; height: 100%; flex: 1; overflow: hidden;">
      <div id="viewer" style="width: 100%; height: 100%;"></div>
      <div id="tap-left" style="position: absolute; top: 0; left: 0; width: 35%; height: 100%; z-index: 5;"></div>
      <div id="tap-center" style="position: absolute; top: 0; left: 35%; width: 30%; height: 100%; z-index: 5;"></div>
      <div id="tap-right" style="position: absolute; top: 0; left: 65%; width: 35%; height: 100%; z-index: 5;"></div>
    </div>

    <div id="reader-footer" class="reader-footer">
      <button id="prev-btn" class="control-btn">◀ Prev</button>
      <div class="progress-info">
        <span id="page-info">Loading...</span>
        <div class="progress-track"><div id="progress-bar"></div></div>
      </div>
      <button id="next-btn" class="control-btn">Next ▶</button>
    </div>
  </div>

  <div id="toc-drawer" class="toc-drawer">
    <div class="toc-header">
      <h3>Table of Contents</h3>
      <button id="close-toc" class="control-btn">✕</button>
    </div>
    <ul id="toc-list"></ul>
  </div>

  <div id="ai-popup" class="ai-popup" style="display: none;">
    <div class="ai-header">
      <span id="ai-word">Selected Text</span>
      <button onclick="hideAiPopup()" style="background:none; border:none; cursor:pointer; color:inherit;">✕</button>
    </div>
    <div id="ai-translation" class="ai-body">Translating...</div>
  </div>

  <script src="app.js"></script>
  <script src="sw.js"></script>
</body>
</html>
