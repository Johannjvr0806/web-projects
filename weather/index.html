<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard | Johann Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#007bff',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-gray-950 to-black">

    <!-- Top Navigation -->
    <div class="w-full max-w-xl flex justify-between items-center mb-6">
        <a href="/" class="text-xs font-semibold text-gray-400 hover:text-white flex items-center gap-1.5 transition">
            <span>←</span> Back to Portfolio
        </a>
        <button id="theme-toggle" class="text-xl p-2 rounded hover:bg-gray-800">🌙</button>
    </div>

    <!-- App Card -->
    <div class="w-full max-w-xl bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-sky-400 via-blue-500 to-indigo-600"></div>

        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white">Weather Dashboard</h1>
            <p class="text-xs text-gray-400 mt-1">Real-time global weather conditions powered by Open-Meteo API.</p>
        </div>

        <form id="search-form" class="flex gap-2 mb-6">
            <input type="text" id="city-input" placeholder="Enter city name (e.g. Pretoria, London, Tokyo)..." required class="flex-1 bg-gray-950/70 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-100 outline-none focus:border-brand focus:ring-1 focus:ring-brand transition">
            <button type="submit" id="search-btn" class="bg-brand hover:bg-blue-600 text-white font-medium text-xs rounded-xl px-5 py-2.5 transition shadow-lg shadow-blue-500/20">Search</button>
        </form>

        <div id="weather-display" class="hidden space-y-6">
            <div class="text-center py-4 bg-gray-950/50 rounded-xl border border-gray-800/80">
                <h2 id="location-name" class="text-lg font-semibold text-gray-200">--</h2>
                <div class="text-5xl font-extrabold text-blue-400 my-2">
                    <span id="current-temp">--</span>°C
                </div>
                <p id="weather-desc" class="text-xs text-gray-400">--</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-950/40 p-3.5 rounded-xl border border-gray-800/60 text-center">
                    <span class="text-[11px] text-gray-400 block uppercase tracking-wider">Wind Speed</span>
                    <span id="wind-speed" class="text-sm font-semibold text-gray-200 mt-1 block">-- km/h</span>
                </div>
                <div class="bg-gray-950/40 p-3.5 rounded-xl border border-gray-800/60 text-center">
                    <span class="text-[11px] text-gray-400 block uppercase tracking-wider">Humidity</span>
                    <span id="humidity" class="text-sm font-semibold text-gray-200 mt-1 block">--%</span>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">3-Day Forecast</h3>
                <div id="forecast-grid" class="grid grid-cols-3 gap-3"></div>
            </div>
        </div>

        <div id="status-message" class="text-center text-xs text-gray-400 py-8 border border-dashed border-gray-800 rounded-xl">
            Type a city name above to fetch live weather data.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
