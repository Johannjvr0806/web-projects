<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | Johann Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#007bff',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-gray-950 to-black">

    <!-- Top Navigation -->
    <div class="w-full max-w-xl flex justify-between items-center mb-6">
        <a href="/" class="text-xs font-semibold text-gray-400 hover:text-white flex items-center gap-1.5 transition">
            <span>←</span> Back to Portfolio
        </a>
        <button id="theme-toggle" class="text-xl p-2 rounded hover:bg-gray-800">🌙</button>
    </div>

    <!-- App Card -->
    <div class="w-full max-w-xl bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white">Task Management</h1>
            <p class="text-xs text-gray-400 mt-1">Organize your workflow with tasks, due dates, priorities, and sub-tasks.</p>
        </div>

        <form id="task-form" class="space-y-3 mb-4">
            <input type="text" id="task-input" placeholder="What needs to be done?" required class="w-full bg-gray-950/70 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-100 outline-none focus:border-brand focus:ring-1 focus:ring-brand transition">
            
            <div class="grid grid-cols-3 gap-2">
                <input type="date" id="due-date-input" class="bg-gray-950/70 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-300 outline-none focus:border-brand">
                <select id="priority-input" class="bg-gray-950/70 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-300 outline-none focus:border-brand">
                    <option value="Low">Low Priority</option>
                    <option value="Medium" selected>Med Priority</option>
                    <option value="High">High Priority</option>
                </select>
                <button type="submit" class="bg-brand hover:bg-blue-600 text-white font-medium text-xs rounded-xl px-4 py-2 transition shadow-lg shadow-blue-500/20">Add Task</button>
            </div>
        </form>

        <input type="text" id="search-input" placeholder="Search tasks..." class="w-full bg-gray-950/50 border border-gray-800/80 rounded-xl px-3.5 py-2 text-xs text-gray-300 outline-none focus:border-brand mb-4">

        <div class="flex justify-between items-center mb-4 text-xs">
            <div class="flex gap-1 bg-gray-950 p-1 rounded-xl border border-gray-800/60">
                <button class="filter-btn active px-3 py-1 rounded-lg text-gray-300 font-medium transition" data-filter="all">All</button>
                <button class="filter-btn px-3 py-1 rounded-lg text-gray-400 hover:text-gray-200 transition" data-filter="active">Active</button>
                <button class="filter-btn px-3 py-1 rounded-lg text-gray-400 hover:text-gray-200 transition" data-filter="completed">Completed</button>
            </div>
            <button id="clear-completed" class="text-rose-400 hover:text-rose-300 text-xs font-medium transition">Clear Done</button>
        </div>

        <ul id="task-list" class="space-y-2 mb-6 min-h-[60px]"></ul>

        <div class="pt-4 border-t border-gray-800/80 flex justify-between items-center text-xs text-gray-400">
            <span id="task-count">0 of 0 tasks completed</span>
            <span class="text-[10px] text-gray-400">Saved locally</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
