<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reader">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
</head>
<body class="theme-purple">

  <!-- APP HEADER -->
  <header id="app-header">
    <div class="nav-tabs">
      <button id="nav-shelf" class="tab-btn active" onclick="switchView('shelf')">📚 Bookshelf</button>
      <button id="nav-reader" class="tab-btn" onclick="switchView('reader')" style="display:none;">📖 Reader</button>
    </div>

    <!-- Theme Picker -->
    <div class="theme-picker">
      <div class="theme-dot light" onclick="setTheme('theme-light')"></div>
      <div class="theme-dot sepia" onclick="setTheme('theme-sepia')"></div>
      <div class="theme-dot purple" onclick="setTheme('theme-purple')"></div>
      <div class="theme-dot navy" onclick="setTheme('theme-navy')"></div>
      <div class="theme-dot dark" onclick="setTheme('theme-dark')"></div>
    </div>

    <div class="header-actions">
      <button id="reading-log-tab-btn" class="action-btn" style="background: #3b82f6 !important; color: white !important;" onclick="toggleReadingLogModal()">📚 Log</button>
      <a href="https://oceanofpdf.com" target="_blank" class="action-btn ocean-btn" title="Download books from OceanOfPDF">📥 Ocean</a>
      <label for="epub-input" class="action-btn upload-btn">📁 Add</label>
      <input type="file" id="epub-input" accept=".epub" multiple style="display:none;">
    </div>
  </header>

  <!-- BOOKSHELF VIEW -->
  <div id="shelf-view" class="view-container">
    <div class="filter-bar" id="filter-bar">
      <!-- Filter buttons auto-injected -->
    </div>
    <div class="shelf-grid" id="shelf-grid">
      <!-- Books dynamically added here -->
    </div>
  </div>

  <!-- READER VIEW -->
  <div id="reader-view" class="view-container" style="display:none;">
    
    <!-- Reader Top Bar (Now contains Highlights) -->
    <div class="reader-header" id="reader-topbar">
      <button class="control-btn" onclick="toggleToc()">☰ TOC</button>
      
      <!-- Highlight Buttons moved to TOP to prevent mobile popup blocking -->
      <div style="display: flex; gap: 4px;">
        <button class="control-btn" onclick="addHighlightFromSelection()" style="background: #f59e0b; color: white;">✨ Highlight</button>
        <button class="control-btn" onclick="toggleHighlightDrawer()" style="background: #8b5cf6; color: white;">💡 List</button>
      </div>

      <div class="font-controls">
        <button class="control-btn" onclick="changeFontSize(-2)">A-</button>
        <button class="control-btn" onclick="changeFontSize(2)">A+</button>
      </div>
    </div>

    <!-- EPUB Viewer Area (No Tap Shield, direct touch enabled!) -->
    <div class="viewer-wrapper">
      <div id="viewer" class="epub-viewer"></div>
    </div>

    <!-- Reader Bottom Control Bar -->
    <div class="reader-footer" id="reader-bottombar">
      <button class="control-btn" onclick="prevPage()">◀ Prev</button>
      <button class="control-btn" onclick="toggleBookmarkDrawer()">🔖 Bookmarks</button>
      <button class="control-btn" onclick="addBookmark()">➕ Bookmark</button>
      <button id="tts-btn" class="control-btn" onclick="toggleTTS()">🔊 Listen</button>
      <div class="progress-info">
        <span id="page-info">Loading...</span>
        <div class="progress-track">
          <div id="progress-bar"></div>
        </div>
      </div>
      <button class="control-btn" onclick="nextPage()">Next ▶</button>
    </div>

    <!-- Table of Contents Drawer -->
    <div id="toc-drawer" class="toc-drawer">
      <div class="toc-header">
        <h3>Contents</h3>
        <button class="control-btn" onclick="toggleToc()">✕</button>
      </div>
      <ul id="toc-list"></ul>
    </div>

    <!-- Bookmarks Drawer -->
    <div id="bookmark-drawer" class="toc-drawer">
      <div class="toc-header">
        <h3>Saved Bookmarks</h3>
        <button class="control-btn" onclick="toggleBookmarkDrawer()">✕</button>
      </div>
      <ul id="bookmark-list"></ul>
    </div>

    <!-- Highlights Drawer -->
    <div id="highlight-drawer" class="toc-drawer">
      <div class="toc-header">
        <h3>Saved Highlights</h3>
        <button class="control-btn" onclick="toggleHighlightDrawer()">✕</button>
      </div>
      <ul id="highlight-list"></ul>
    </div>
  </div>

  <!-- Reading Log Drawer -->
  <div id="reading-log-modal" class="toc-drawer" style="left: auto; right: -400px; width: 380px; transition: right 0.3s ease; z-index: 200;">
    <div class="toc-header">
      <h3>Reading Log (<span id="safe-total-count">0</span>)</h3>
      <button class="control-btn" onclick="toggleReadingLogModal()">✕</button>
    </div>
    <div style="padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid rgba(128,128,128,0.2);">
      <input type="text" id="safe-book-title" placeholder="Book Title" style="padding: 8px; border-radius: 6px; border: 1px solid rgba(128,128,128,0.3); background: inherit; color: inherit; font-size: 14px;">
      <input type="text" id="safe-book-author" placeholder="Author" style="padding: 8px; border-radius: 6px; border: 1px solid rgba(128,128,128,0.3); background: inherit; color: inherit; font-size: 14px;">
      <button class="tab-btn active" onclick="addSafeBook()" style="width: 100%;">+ Add Book</button>
      <button class="control-btn" onclick="toggleImportBox()" style="width: 100%; font-size: 12px; margin-top: 4px;">📥 Bulk Import / Export</button>
    </div>
    <div id="bulk-import-container" style="display: none; padding: 12px; border-bottom: 1px solid rgba(128,128,128,0.2); background: rgba(0,0,0,0.05);">
      <textarea id="bulk-import-text" placeholder="Paste books here..." style="width: 100%; height: 80px; padding: 6px; font-size: 11px; border-radius: 4px; border: 1px solid rgba(128,128,128,0.3); background: inherit; color: inherit; resize: vertical;"></textarea>
      <button class="tab-btn active" onclick="processBulkImport()" style="width: 100%; margin-top: 6px; font-size: 12px;">Import List</button>
    </div>
    <ol id="safe-reading-list" style="flex: 1; overflow-y: auto; list-style: decimal; padding: 10px 10px 10px 30px; margin: 0;"></ol>
  </div>

  <script src="app.js"></script>
</body>
</html>
