<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>My Task List</h1>
            <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
        </div>
        <p class="subtitle">Add tasks below. They stay saved in your browser!</p>

        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Enter a new task..." required>
            <input type="date" id="due-date-input">
            <select id="priority-input">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <button type="submit" id="add-btn">Add Task</button>
        </form>

        <input type="text" id="search-input" placeholder="Search tasks...">

        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button id="clear-completed-btn">Clear Completed</button>
        </div>

        <ul id="todo-list"></ul>

        <div class="footer">
            <span id="task-counter">0 of 0 tasks completed</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
